<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar Viewer</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #6a7282; --line: #dde1e8; --hover: #eef1f6;
  --accent: #2f6fde; --weekend: #f1f2f5; --allday: #ececec;
  --ok: #2e8b57; --ok-bg: #e5f4eb;
  --chip-bg: #eef2f8;
  --conflict: #c62828; --conflict-bg: #fde8e8;
  --overlap: #d26a00; --overlap-bg: #fff0dc;
  --sameday: #9a7b00; --sameday-bg: #fdf6d3;
  --dup: #7b3fb5; --dup-bg: #f1e7fb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1c2027; --ink: #e5e8ee; --muted: #9aa3b2; --line: #2e343e; --hover: #262b34;
    --accent: #6d9eff; --weekend: #191c22; --allday: #24272d;
    --ok: #5cc48a; --ok-bg: #183126; --chip-bg: #232a36;
    --conflict: #ff6b6b; --conflict-bg: #3b1d1f;
    --overlap: #ffa94d; --overlap-bg: #3a2814;
    --sameday: #e5c84a; --sameday-bg: #332d12;
    --dup: #c39bf0; --dup-bg: #2c2140;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --panel: #1c2027; --ink: #e5e8ee; --muted: #9aa3b2; --line: #2e343e; --hover: #262b34;
  --accent: #6d9eff; --weekend: #191c22; --allday: #24272d;
  --ok: #5cc48a; --ok-bg: #183126; --chip-bg: #232a36;
  --conflict: #ff6b6b; --conflict-bg: #3b1d1f;
  --overlap: #ffa94d; --overlap-bg: #3a2814;
  --sameday: #e5c84a; --sameday-bg: #332d12;
  --dup: #c39bf0; --dup-bg: #2c2140;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
html, body { height: 100%; }
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100vh; }
.side { overflow-y: auto; padding: 12px 14px; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 12px; }
.side section { display: flex; flex-direction: column; gap: 6px; }
.side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; }
.side .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.side .row > input[type=url], .side .row > input[type=search], .side .row > input[type=text] { flex: 1; }
.side .stat { font-size: 12px; padding: 2px 8px; }
.side details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 10px 14px; }
.main > .bar { margin: 0 0 8px; }
#view { flex: 1; min-height: 0; overflow: auto; }
.chip[hidden] { display: none; }
.more { display: block; width: 100%; margin-top: 2px; padding: 0 4px; font-size: 11px; text-align: left; border: 0; background: none; color: var(--accent); }
h1 { font-size: 20px; margin: 4px 0 2px; }
.sub, .small { color: var(--muted); font-size: 12.5px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
button, input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
button { cursor: pointer; }
button:hover { background: var(--hover); }
button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--conflict); border-color: var(--conflict); }
input { min-width: 0; }
label.chk { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
#month-title { font-size: 18px; font-weight: 600; min-width: 150px; }
.grow { flex: 1; }
.sources { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.src { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto; align-items: center; gap: 2px 6px; padding: 4px 0; border-top: 1px solid var(--line); font-size: 13px; }
.src:first-child { border-top: 0; }
.src .nm { font-weight: 600; cursor: text; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src .meta { grid-column: 3 / -1; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src button { padding: 0 6px; font-size: 12px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; }
.stat { border-radius: 999px; padding: 3px 10px; font-size: 13px; border: 1px solid var(--line); background: var(--panel); }
.st-CONFLICT { background: var(--conflict-bg); color: var(--conflict); border-color: var(--conflict); }
.st-OVERLAP { background: var(--overlap-bg); color: var(--overlap); border-color: var(--overlap); }
.st-SAMEDAY { background: var(--sameday-bg); color: var(--sameday); border-color: var(--sameday); }
.st-HOLIDAY { background: var(--allday); color: var(--muted); }
.st-DUPLICATE { background: var(--dup-bg); color: var(--dup); border-color: var(--dup); }
.st-OK { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.warn { color: var(--overlap); font-size: 13px; margin: 4px 0; }
.err { color: var(--conflict); font-size: 13px; white-space: pre-wrap; }
.msg { font-size: 13px; white-space: pre-wrap; color: var(--muted); margin: 4px 0; }

.grid { display: grid; height: 100%; grid-template-columns: 34px repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); background: var(--panel); border-radius: 8px; overflow: hidden; }
.grid > div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.dow { padding: 6px; font-weight: 600; color: var(--muted); text-align: center; font-size: 12px; }
.wk { color: var(--muted); font-size: 11px; text-align: center; padding-top: 6px; }
.day { min-height: 0; padding: 3px; overflow: hidden; }
.day.other { opacity: .45; }
.day.weekend { background: var(--weekend); }
.day.hol { background: var(--allday); }
.day.drop { outline: 2px dashed var(--accent); outline-offset: -3px; background: var(--hover); }
.dnum { font-size: 12px; font-weight: 600; }
.day.today .dnum > span { background: var(--accent); color: #fff; border-radius: 999px; padding: 0 6px; }
.chip { display: block; width: 100%; margin-top: 2px; padding: 1px 4px; font-size: 11.5px; line-height: 1.3; border-radius: 4px; border-left: 3px solid; background: var(--chip-bg);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.chip[draggable="true"] { cursor: grab; }
.chip:focus-visible { outline: 2px solid var(--accent); }
.chip.allday { font-style: italic; }
.chip.tentative { border-left-style: dashed; }
.chip.notmine { opacity: .7; }
.chip.s-CONFLICT { background: var(--conflict-bg); color: var(--conflict); font-weight: 600; box-shadow: inset 0 0 0 1px var(--conflict); }
.chip.s-OVERLAP { background: var(--overlap-bg); box-shadow: inset 0 0 0 1px var(--overlap); }
.chip.s-SAMEDAY { background: var(--sameday-bg); }
.chip.s-DUPLICATE { box-shadow: inset 0 0 0 1px var(--dup); }
.chip.edited::after { content: " ✎"; }
.chip.created::after { content: " ✚"; }
.chip .t { font-variant-numeric: tabular-nums; color: var(--muted); margin-right: 3px; }

table { width: 100%; border-collapse: collapse; background: var(--panel); }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { position: sticky; top: 0; background: var(--panel); font-size: 12px; color: var(--muted); }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--hover); }
tr.r-CONFLICT td:first-child { box-shadow: inset 3px 0 var(--conflict); }
tr.r-OVERLAP td:first-child { box-shadow: inset 3px 0 var(--overlap); }
tr.r-SAMEDAY td:first-child { box-shadow: inset 3px 0 var(--sameday); }
tr.r-DUPLICATE td:first-child { box-shadow: inset 3px 0 var(--dup); }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.pill { display: inline-block; border-radius: 999px; padding: 0 7px; font-size: 12px; border: 1px solid; white-space: nowrap; }
td .pill { max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: top; }
td.small { overflow-wrap: anywhere; }
table.events { table-layout: fixed; }
table.events td { overflow-wrap: anywhere; }
table.events th:nth-child(1) { width: 110px; } table.events th:nth-child(2) { width: 100px; } table.events th:nth-child(3) { width: 14%; }
table.events th:nth-child(5) { width: 104px; } table.events th:nth-child(6) { width: 28%; }

dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); max-width: min(760px, calc(100vw - 32px)); width: 100%; max-height: calc(100vh - 40px); }
dialog::backdrop { background: rgb(0 0 0 / .35); }
dialog h2 { margin: 4px 0; font-size: 17px; }
dialog h3 { font-size: 14px; margin: 10px 0 4px; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 8px 0; }
dt { color: var(--muted); }
dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.form { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 10px; align-items: center; margin: 8px 0; }
.form > label { color: var(--muted); }
.form input:not([type=checkbox]), .form select, .form textarea { width: 100%; }
.preview { max-height: 220px; overflow: auto; font-size: 12px; }
.preview td, .preview th { padding: 3px 6px; }
.changes li { margin: 4px 0; }
.changes li button { margin-left: 6px; padding: 0 8px; font-size: 12px; }
#drop { position: fixed; inset: 0; display: none; place-items: center; background: rgb(47 111 222 / .15); border: 3px dashed var(--accent); font-size: 20px; font-weight: 600; z-index: 10; }
body.dragging #drop { display: grid; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; height: auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
  #view { overflow: visible; }
  .grid { height: auto; }
}
@media (max-width: 760px) {
  .grid { grid-template-columns: 22px repeat(7, minmax(0, 1fr)); }
  .day { min-height: 70px; padding: 2px; }
  .chip { font-size: 10px; padding: 0 2px; }
  .chip .t { display: none; }
  #month-title { min-width: 0; font-size: 16px; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>
<div id="drop">Drop .ics / .xlsx / .csv / .tsv files to add them</div>
<div class="app">
<aside class="side">
  <div>
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
  </div>

  <section>
    <h2>Sources</h2>
    <div class="row">
      <input type="file" id="file" accept=".ics,.ical,.ifb,.xlsx,.xlsm,.csv,.tsv,.txt,text/calendar,text/csv" multiple hidden>
      <button type="button" id="file-btn">Open files…</button>
      <button type="button" id="new-src">+ Empty source</button>
    </div>
    <form id="url-form" class="row">
      <input type="url" id="url" placeholder="https://… .ics / .csv or webcal://" aria-label="Source URL">
      <button type="submit">Load</button>
    </form>
    <div id="load-msg"></div>
    <div class="sources" id="sources"></div>
  </section>

  <section>
    <h2>Filter</h2>
    <label class="row chk" title="Your initials and/or names, comma-separated. Events listing one of them, or in a source marked “mine”, are yours.">Me <input type="text" id="me" placeholder="initials or names, e.g. AB, Anna Berg"></label>
    <div class="row">
      <label class="chk"><input type="checkbox" id="f-mine"> only mine</label>
      <label class="chk"><input type="checkbox" id="f-prob"> only problems</label>
    </div>
    <div class="row"><input type="search" id="q" placeholder="Search…" aria-label="Search"></div>
  </section>

  <section>
    <h2>Checks</h2>
    <div class="stats" id="stats"></div>
    <div id="coverage"></div>
  </section>

  <section>
    <h2>Edit &amp; export</h2>
    <div class="row">
      <button type="button" id="new">+ New event</button>
      <button type="button" id="changes">Changes: 0</button>
      <button type="button" id="export">Export…</button>
    </div>
  </section>

  <details>
    <summary>Legend &amp; help</summary>
    <p class="small" id="legend"></p>
  </details>
</aside>

<main class="main">
  <div class="bar">
    <div id="month-title"></div>
    <button type="button" id="prev" aria-label="Previous month" title="Previous month (←)">◀</button>
    <button type="button" id="next" aria-label="Next month" title="Next month (→)">▶</button>
    <button type="button" id="today">Today</button>
    <input type="month" id="goto" aria-label="Go to month">
    <span class="grow"></span>
    <button type="button" id="v-month">Month</button>
    <button type="button" id="v-list">List</button>
  </div>
  <div id="view"></div>
</main>
</div>

<dialog id="dlg"><form method="dialog"><div id="dlg-body"></div><div class="bar" style="justify-content:flex-end"><button>Close</button></div></form></dialog>

<script id="data" type="application/json">{"title": "", "me": "", "files": [], "generated": "2026-10-25 10:28"}</script>
<script>
"use strict";
const DATA = (() => { try { return JSON.parse(document.getElementById("data").textContent); } catch { return {}; } })();
const TZ = "Europe/Stockholm";
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const COLORS = ["#2f6fde", "#2e8b57", "#b5179e", "#e07a00", "#0f9d9a", "#5a6acf", "#7a8b00", "#c0392b"];
const STATUS_LABEL = { CONFLICT: "CONFLICT", OVERLAP: "OVERLAP", SAMEDAY: "SAME DAY", HOLIDAY: "HOLIDAY", DUPLICATE: "DUPLICATE", OK: "OK" };
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------- tiny DOM helper (all text via textContent)
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}

// ---------------------------------------------------------------- dates: wall-clock strings "YYYY-MM-DDTHH:MM" in Europe/Stockholm
const pad = (n) => String(n).padStart(2, "0");
const dOf = (t) => t.slice(0, 10);
const hm = (t) => t.slice(11, 16);
function ymd(y, m, d) { const x = new Date(Date.UTC(y, m - 1, d)); return `${x.getUTCFullYear()}-${pad(x.getUTCMonth() + 1)}-${pad(x.getUTCDate())}`; }
function addDays(ds, n) { const [y, m, d] = ds.split("-").map(Number); return ymd(y, m, d + n); }
function weekday(ds) { const [y, m, d] = ds.split("-").map(Number); return (new Date(Date.UTC(y, m - 1, d)).getUTCDay() + 6) % 7; }
function isoWeek(ds) {
  const [y, m, d] = ds.split("-").map(Number);
  const t = new Date(Date.UTC(y, m - 1, d)); t.setUTCDate(t.getUTCDate() + 3 - (t.getUTCDay() + 6) % 7);
  const w1 = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((t - w1) / 864e5 - 3 + (w1.getUTCDay() + 6) % 7) / 7);
}
const fmtCache = {};
function wallClock(ts, tz) {
  const f = fmtCache[tz] ||= new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
  const p = Object.fromEntries(f.formatToParts(new Date(ts)).map((x) => [x.type, x.value]));
  return { s: `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`, utc: Date.UTC(+p.year, p.month - 1, +p.day, +p.hour, +p.minute, +p.second) };
}
function zonedToUtc(y, mo, d, hh, mi, tz) {
  const guess = Date.UTC(y, mo - 1, d, hh, mi);
  const ts = guess - (wallClock(guess, tz).utc - guess);
  return ts - (wallClock(ts, tz).utc - guess);
}
const toMs = (t) => Date.UTC(+t.slice(0, 4), t.slice(5, 7) - 1, +t.slice(8, 10), +t.slice(11, 13), +t.slice(14, 16));
const fromMs = (ms) => { const x = new Date(ms); return `${x.getUTCFullYear()}-${pad(x.getUTCMonth() + 1)}-${pad(x.getUTCDate())}T${pad(x.getUTCHours())}:${pad(x.getUTCMinutes())}`; };
const minutes = (a, b) => (toMs(b) - toMs(a)) / 6e4;
const todayStr = () => wallClock(Date.now(), TZ).s.slice(0, 10);
function fnv(str) { let x = 0x811c9dc5; for (const c of str) x = Math.imul(x ^ c.codePointAt(0), 0x01000193) >>> 0; return x.toString(16).padStart(8, "0"); }

// ---------------------------------------------------------------- ics parsing (TimeEdit part mirrors calics.parse_ics)
const NAME = /^[A-ZÅÄÖ][a-zåäöéü]+(?:[ -][A-ZÅÄÖ][a-zåäöéü]+)+$/;
const COURSE_CODE = /^[A-ZÅÄÖ]{3,4}\d{2,3}$/;
const GROUP = /^[A-Z0-9]+(?:-[A-Z0-9]+)*-\d{2}[HV]$/;
const unesc = (s) => s.replace(/\\[nN]/g, "\n").replace(/\\,/g, ",").replace(/\\;/g, ";").replace(/\\\\/g, "\\");
const splitEsc = (s) => s.split("\\,").map((p) => unesc(p).trim());

function parseDt(params, v) {
  if (/VALUE=DATE(?!-)/i.test(params) || /^\d{8}$/.test(v)) return { t: `${v.slice(0, 4)}-${v.slice(4, 6)}-${v.slice(6, 8)}T00:00`, allday: true };
  const m = v.match(/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)?(Z)?$/);
  if (!m) throw new Error("unreadable date " + v);
  const [y, mo, d, hh, mi] = [+m[1], +m[2], +m[3], +m[4], +m[5]];
  const tz = (params.match(/TZID=("?)([^;:"]+)\1/i) || [])[2];
  if (m[7]) return { t: wallClock(Date.UTC(y, mo - 1, d, hh, mi), TZ).s, allday: false };
  if (!tz || tz === TZ) return { t: `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}`, allday: false };
  try { return { t: wallClock(zonedToUtc(y, mo, d, hh, mi, tz), TZ).s, allday: false }; }
  catch { return { t: `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}`, allday: false }; }   // Windows TZIDs etc: assume local
}

// TimeEdit SUMMARY/DESCRIPTION -> course, title (activity), people (teachers), groups, comment, TimeEdit ID
function parseTimeEdit(summary, description) {
  const parts = splitEsc(summary);
  const desc = unesc(description).split("\n").map((l) => l.trim()).filter(Boolean);
  const ev = { course: "", title: "", people: [], groups: [], comment: "", id: (desc.find((l) => l.startsWith("ID ")) || "").slice(3), style: "" };
  if (parts.some((p) => p.startsWith("Grupp:"))) {
    ev.style = "names";
    ev.course = parts.shift();
    while (parts.length && parts[0].startsWith("Grupp:")) ev.groups.push(parts.shift().slice(6).trim());
    ev.title = parts.length ? parts.shift() : "";
    if (parts.length && /^\d+$/.test(parts[parts.length - 1])) parts.pop();
    while (parts.length && NAME.test(parts[0])) ev.people.push(parts.shift());
    ev.comment = parts.join(", ").replace(/\s+/g, " ");
  } else if (parts.length && COURSE_CODE.test(parts[0])) {
    ev.style = "codes";
    const codes = [];
    while (parts.length && COURSE_CODE.test(parts[0])) codes.push(parts.shift());
    ev.course = codes.join(", ");
    ev.title = parts.join(", ");
    const isGroup = (l) => GROUP.test(l) || COURSE_CODE.test(l);
    let seen = !desc.some(isGroup);
    const rest = [];
    for (const l of desc) {
      if (l.startsWith("ID ")) continue;
      if (isGroup(l)) { ev.groups.push(l); seen = true; }
      else if (seen && NAME.test(l)) ev.people.push(l);
      else rest.push(l);
    }
    ev.comment = rest.join(" ").replace(/\s+/g, " ");
  }
  return ev;
}

// Expand simple RRULEs (DAILY/WEEKLY/MONTHLY with INTERVAL, COUNT, UNTIL, BYDAY) – enough for Google/Outlook feeds.
function expand(start, end, rrule, exdates) {
  const r = Object.fromEntries(rrule.split(";").map((kv) => kv.split("=")));
  const len = minutes(start, end), tod = start.slice(10);
  const step = +(r.INTERVAL || 1), max = Math.min(+(r.COUNT || 1000), 1000);
  const until = r.UNTIL ? parseDt("", r.UNTIL).t : addDays(dOf(start), 3 * 366) + "T23:59";
  const by = r.BYDAY ? r.BYDAY.split(",").map((x) => ["MO", "TU", "WE", "TH", "FR", "SA", "SU"].indexOf(x.slice(-2))) : null;
  const out = [];

  $("me").value = state.me;
  $("legend").textContent = "Coloured left edge = source. Red = CONFLICT (two of your events overlap), orange = OVERLAP (overlaps an event that is not yours), yellow = SAME DAY as one of your events from another source, " +
    "grey day = all-day event (e.g. holiday), purple outline / ×2 = DUPLICATE (same event in several sources, shown once), dashed edge = tentative, faded = not yours. " +
    "Drag an event to another day (Ctrl/Alt-drag copies), double-click a day to add one, click an event to edit (✎ changed, ✚ new). Changes stay in this page until you export them.";
  const m = location.hash.match(/^#(\d{4})-(\d{2})(?:\/(month|list))?/);
  state.ym = m ? [+m[1], +m[2]] : [+todayStr().slice(0, 4), +todayStr().slice(5, 7)];
  if (m && m[3]) state.view = m[3];

  const errs = [];
  for (const f of DATA.files || []) {
    try { await loadOne(f.name, f.b64 ? b64ToBuf(f.b64) : new TextEncoder().encode(f.text).buffer, false, false); }
    catch (e) { errs.push(`${f.name}: ${e.message}`); }
  }
  if (errs.length) msg(errs.join("\n"), "err");

  $("prev").onclick = () => shift(-1);
  $("next").onclick = () => shift(1);
  $("today").onclick = () => goMonth(todayStr());
  $("goto").onchange = (e) => { if (e.target.value) goMonth(e.target.value + "-01"); };
  $("v-month").onclick = () => setView("month");
  $("v-list").onclick = () => setView("list");
  $("me").oninput = (e) => { state.me = e.target.value; refresh(); };
  for (const [id, key] of [["f-mine", "mine"], ["f-prob", "prob"]]) $(id).onchange = (e) => { state.f[key] = e.target.checked; render(); };
  $("q").oninput = (e) => { state.f.q = e.target.value.trim(); render(); };
  $("export").onclick = () => exportDialog(false);
  $("new").onclick = () => editForm(null, { date: `${state.ym[0]}-${pad(state.ym[1])}` === todayStr().slice(0, 7) ? todayStr() : ymd(state.ym[0], state.ym[1], 1) });
  $("changes").onclick = showChanges;
  $("new-src").onclick = () => { const n = prompt("Name of the new source", "My events"); if (n && n.trim()) { lastTarget = addSource(n.trim(), [], { local: true, info: "created in this page" }); refresh(); } };
  $("file-btn").onclick = () => $("file").click();
  $("file").onchange = (e) => { loadFiles([...e.target.files]); e.target.value = ""; };
  $("url-form").onsubmit = (e) => { e.preventDefault(); loadUrl($("url").value); };
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (state.view === "month") fitDays(); }, 100); });
  window.addEventListener("beforeunload", (e) => { if (changes().length) { e.preventDefault(); e.returnValue = ""; } });
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, select, textarea") || $("dlg").open) return;
    if (e.key === "ArrowLeft") shift(-1); else if (e.key === "ArrowRight") shift(1);
  });
  let depth = 0;
  const hasFiles = (e) => [...e.dataTransfer.types].includes("Files");
  document.addEventListener("dragenter", (e) => { if (hasFiles(e)) { depth++; document.body.classList.add("dragging"); } });
  document.addEventListener("dragleave", (e) => { if (hasFiles(e) && --depth <= 0) { depth = 0; document.body.classList.remove("dragging"); } });
  document.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
  document.addEventListener("drop", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault(); depth = 0; document.body.classList.remove("dragging");
    loadFiles([...e.dataTransfer.files]);
  });
  refresh();
  if (!m) jumpToData();
  document.body.dataset.ready = "1";
}
init();
</script>
</body>
</html>
